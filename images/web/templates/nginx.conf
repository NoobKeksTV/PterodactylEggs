worker_processes ${WEB_WORKERS};
pid ${RUN_DIR}/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path ${RUN_DIR}/client_body;
    proxy_temp_path ${RUN_DIR}/proxy;
    fastcgi_temp_path ${RUN_DIR}/fastcgi;
    uwsgi_temp_path ${RUN_DIR}/uwsgi;
    scgi_temp_path ${RUN_DIR}/scgi;

    log_format egopvp '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';
    access_log ${ACCESS_LOG};

    sendfile on;
    tcp_nopush on;
    server_tokens off;
    keepalive_timeout 65;
    client_max_body_size ${UPLOAD_MAX}m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml font/ttf font/otf;

    map $http_x_forwarded_proto $egopvp_https {
        default "";
        https on;
    }

${REAL_IP_BLOCK}

    server {
        listen ${SERVER_PORT} default_server;
${LISTEN_V6}        server_name _;
        root ${DOC_ROOT_PATH};
        index ${INDEX_FILES};
        charset utf-8;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;

        location ~ /\.(?!well-known) {
            deny all;
            return 404;
        }

        location ~* \.(?:css|js|mjs|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm)$ {
            expires 7d;
            access_log off;
            try_files $uri =404;
        }

        include ${RUN_DIR}/site.d/*.conf;
        include /home/container/config/nginx/*.conf;
    }
}
