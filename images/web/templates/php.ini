memory_limit = ${PHP_MEMORY_LIMIT}M
upload_max_filesize = ${UPLOAD_MAX}M
post_max_size = ${UPLOAD_MAX}M
max_execution_time = ${PHP_MAX_EXECUTION}
max_input_vars = 5000
expose_php = Off
display_errors = Off
log_errors = On
date.timezone = ${TZ}
session.save_path = "${RUN_DIR}/sessions"
upload_tmp_dir = "${RUN_DIR}/uploads"
sys_temp_dir = "${RUN_DIR}/tmp"
opcache.enable = 1
opcache.memory_consumption = 64
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
