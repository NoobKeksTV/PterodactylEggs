[global]
pid = ${RUN_DIR}/php-fpm.pid
error_log = /proc/self/fd/2
log_level = warning
daemonize = no

[www]
listen = ${RUN_DIR}/php-fpm.sock
listen.mode = 0660
pm = dynamic
pm.max_children = ${PHP_MAX_CHILDREN}
pm.start_servers = ${PHP_START_SERVERS}
pm.min_spare_servers = 1
pm.max_spare_servers = ${PHP_START_SERVERS}
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = ${PHP_ERROR_LOG}
php_admin_flag[log_errors] = on
